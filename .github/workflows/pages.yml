name: Deploy web build to GitHub Pages

# Publishes the playable web version at https://<owner>.github.io/<repo>/.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main, 'claude/new-session-l88hoo']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web --output-dir dist
      - name: Add SPA fallback and disable Jekyll
        # Pages has no rewrite rules: serving index.html as the 404 page lets deep links
        # (e.g. /settings) load the app, which then routes client-side.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
